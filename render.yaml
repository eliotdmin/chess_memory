# Render Blueprint - https://render.com
# Deploy: connect repo at render.com; Render assigns a stable URL like chess-eval-quiz.onrender.com
services:
  - type: web
    name: chess-eval-quiz
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: initial-dev
    # startCommand comes from Dockerfile CMD; add explicitly if Render prompts:
    startCommand: gunicorn api.server:app --bind 0.0.0.0:$PORT
